<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main class="card">
    <form method="get" action="review.html">

      <!-- Product -->
      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Rating -->
        <fieldset>
        <legend>Overall Rating *</legend>

        <div class="rating">
            <div>
            <input type="radio" id="r1" name="rating" value="1" required>
            <label for="r1">★</label>
            </div>

            <div>
            <input type="radio" id="r2" name="rating" value="2" required>
            <label for="r2">★★</label>
            </div>

            <div>
            <input type="radio" id="r3" name="rating" value="3" required>
            <label for="r3">★★★</label>
            </div>

            <div>
            <input type="radio" id="r4" name="rating" value="4" required>
            <label for="r4">★★★★</label>
            </div>

            <div>
            <input type="radio" id="r5" name="rating" value="5" required>
            <label for="r5">★★★★★</label>
            </div>
        </div>
        </fieldset>



      <!-- Date -->
      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required>

      <!-- Features -->
        <fieldset>
        <legend>
            Which features did you find useful in the product?
            <em>(Check all that apply)</em>
        </legend>

        <input type="checkbox" id="durability" name="features" value="Durability">
        <label for="durability">Durability</label>

        <input type="checkbox" id="ease" name="features" value="Ease of Use">
        <label for="ease">Ease of Use</label>

        <input type="checkbox" id="performance" name="features" value="Performance">
        <label for="performance">Performance</label>

        <input type="checkbox" id="design" name="features" value="Design">
        <label for="design">Design</label>
        </fieldset>


      <!-- Written -->
      <label for="review">
        Written Review <span class="optional">(Optional)</span>
      </label>
      <textarea id="review" name="review"></textarea>

      <!-- Name -->
      <label for="userName">
        Your Name <span class="optional">(Optional)</span>
      </label>
      <input type="text" id="userName" name="userName">

      <input type="submit" value="Post Review">

    </form>
  </main>

  <footer>
  <p>©2026 🌺 Elizabeth Sofia Muralles Soto 🌺</p>
  <p>Last Modification: <span id="lastModified"></span></p>
</footer>

</body>
</html>
