<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Submit a product review">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>

    <link rel="stylesheet" href="css/styles.css">
    <script src="js/products.js" defer></script>
    <script src="js/main.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <div class="form-group">
                <label for="product">Product Name <span class="required">*</span></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    <!-- JS inserts options here -->
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="form-group">
                <legend>Overall Rating <span class="required">*</span></legend>

                <label for="rating1">
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    1
                </label>

                <label for="rating2">
                    <input type="radio" id="rating2" name="rating" value="2">
                    2
                </label>

                <label for="rating3">
                    <input type="radio" id="rating3" name="rating" value="3">
                    3
                </label>

                <label for="rating4">
                    <input type="radio" id="rating4" name="rating" value="4">
                    4
                </label>

                <label for="rating5">
                    <input type="radio" id="rating5" name="rating" value="5">
                    5
                </label>
            </fieldset>

            <!-- Date -->
            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="form-group">
                <legend>Useful Features</legend>

                <label for="feature1">
                    <input type="checkbox" id="feature1" name="features" value="easy">
                    Easy to use
                </label>

                <label for="feature2">
                    <input type="checkbox" id="feature2" name="features" value="design">
                    Great design
                </label>

                <label for="feature3">
                    <input type="checkbox" id="feature3" name="features" value="performance">
                    Good performance
                </label>

                <label for="feature4">
                    <input type="checkbox" id="feature4" name="features" value="value">
                    Good value
                </label>
            </fieldset>

            <!-- Written Review -->
            <div class="form-group">
                <label for="review">Written Review</label>
                <textarea id="review" name="review" rows="4"></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="userName">User Name</label>
                <input type="text" id="userName" name="userName">
            </div>

            <!-- Submit -->
            <div class="form-group">
                <input type="submit" value="Submit Review">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 | Product Review</p>
    </footer>
</body>
</html>
