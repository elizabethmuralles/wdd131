<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main class="card">
    <form method="get" action="review.html">

      <!-- Product -->
      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Rating -->
      <fieldset>
        <legend>Overall Rating</legend>

        <div class="rating">
          <div>
            <span>★</span>
            <input type="radio" id="r1" name="rating" value="1" required>
          </div>

          <div>
            <span>★★</span>
            <input type="radio" id="r2" name="rating" value="2">
          </div>

          <div>
            <span>★★★</span>
            <input type="radio" id="r3" name="rating" value="3">
          </div>

          <div>
            <span>★★★★</span>
            <input type="radio" id="r4" name="rating" value="4">
          </div>

          <div>
            <span>★★★★★</span>
            <input type="radio" id="r5" name="rating" value="5">
          </div>
        </div>
      </fieldset>

      <!-- Date -->
      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required>

      <!-- Features -->
      <fieldset>
        <legend>
          Which features did you find useful in the product?
          <em>(Check all that apply)</em>
        </legend>

        <label><input type="checkbox" name="features" value="Durability"> Durability</label>
        <label><input type="checkbox" name="features" value="Ease of Use"> Ease of Use</label>
        <label><input type="checkbox" name="features" value="Performance"> Performance</label>
        <label><input type="checkbox" name="features" value="Design"> Design</label>
      </fieldset>

      <!-- Written -->
      <label for="review">
        Written Review <span class="optional">(Optional)</span>
      </label>
      <textarea id="review" name="review"></textarea>

      <!-- Name -->
      <label for="userName">
        Your Name <span class="optional">(Optional)</span>
      </label>
      <input type="text" id="userName" name="userName">

      <input type="submit" value="Post Review">

    </form>
  </main>

  <footer>
  <p>©2026 🌺 Elizabeth Sofia Muralles Soto 🌺</p>
  <p>Last Modification: <span id="lastModified"></span></p>
</footer>

</body>
</html>
